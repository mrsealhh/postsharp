name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build, test and format
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install CSharpier
        run: dotnet tool install --global csharpier --version 1.3.0

      - name: Check formatting
        run: csharpier check .

      - name: Build
        run: dotnet build PostSharp.slnx -c Debug

      - name: Test
        run: dotnet test tests/PostSharp.Tests/PostSharp.Tests.csproj -c Debug --no-build
