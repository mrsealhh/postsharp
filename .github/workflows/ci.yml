name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: Build, test and format
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install CSharpier
        run: dotnet tool install --global csharpier --version 1.3.0

      - name: Check formatting
        run: csharpier check .

      - name: Build
        run: dotnet build PostSharp.slnx -c Debug

      - name: Validate packaging manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-Content packaging/scoop/postsharp.json -Raw | ConvertFrom-Json | Out-Null
          $winget = Get-Content packaging/winget/PostSharp.yaml -Raw
          if ($winget -notmatch 'InstallerSha256:\s+[0-9A-Fa-f]{64}') { throw 'winget manifest is missing InstallerSha256.' }
          $brew = Get-Content packaging/homebrew/postsharp.rb -Raw
          if ($brew -notmatch 'sha256\s+"[0-9A-Fa-f]{64}"') { throw 'Homebrew cask is missing sha256.' }

      - name: Test
        run: dotnet test tests/PostSharp.Tests/PostSharp.Tests.csproj -c Debug --no-build

  headless-linux:
    name: Headless Linux MCP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Xvfb and Avalonia dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb curl libx11-6 libice6 libsm6 libfontconfig1 libfreetype6 \
            libxrandr2 libxi6 libgl1 libegl1 libdbus-1-3 libgtk-3-0

      - name: Publish Linux package
        run: |
          dotnet publish src/PostSharp/PostSharp.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:Version=0.0.0-ci -o artifacts/headless

      - name: Start headless MCP
        run: |
          export POSTSHARP_DATA_DIR="$(mktemp -d)"
          xvfb-run -a artifacts/headless/PostSharp --headless > headless.log 2>&1 &
          echo $! > headless.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5199/api/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Headless MCP did not become ready"
            cat headless.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:5199/api/health

      - name: Check MCP tools
        run: |
          cat > initialize.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}
          JSON
          curl -fsS -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @initialize.json http://127.0.0.1:5199/mcp > initialize-response.json
          cat > tools-request.json <<'JSON'
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          JSON
          curl -fsS -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @tools-request.json http://127.0.0.1:5199/mcp > tools.json
          cat tools.json
          python3 - <<'PY'
          import json
          data = json.load(open("tools.json"))
          tools = [tool["name"] for tool in data["result"]["tools"]]
          assert "verify_endpoint" in tools
          assert "start_sequence_run" in tools
          assert "start_import" in tools
          print(f"{len(tools)} tools")
          PY

      - name: Run demo suite
        run: |
          mcp_call() {
            local id="$1" name="$2" arguments="$3" output="$4"
            printf '{"jsonrpc":"2.0","id":%s,"method":"tools/call","params":{"name":"%s","arguments":%s}}' \
              "$id" "$name" "$arguments" > request.json
            curl -fsS -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data-binary @request.json http://127.0.0.1:5199/mcp > "$output"
          }

          mcp_call 3 list_suites '{}' suites.json
          SUITE_ID=$(python3 -c 'import json; d=json.load(open("suites.json")); s=json.loads(d["result"]["content"][0]["text"]); print(s[0]["id"])')
          mcp_call 4 run_suite "{\"id\":\"$SUITE_ID\"}" run.json
          python3 - <<'PY'
          import json
          data = json.load(open("run.json"))
          result = json.loads(data["result"]["content"][0]["text"])
          assert result["total"] >= 1, result
          assert result["failed"] == 0, result
          print(f"suite passed {result['passed']}/{result['total']}")
          PY

      - name: Stop headless service
        if: always()
        run: |
          if [ -f headless.pid ]; then kill "$(cat headless.pid)" 2>/dev/null || true; fi
          pkill -f 'artifacts/headless/PostSharp' 2>/dev/null || true

      - name: Upload headless log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headless-log
          path: headless.log
          if-no-files-found: ignore

  docker-headless:
    name: Docker headless image
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t postsharp-headless:ci .

      - name: Start container
        run: |
          docker run -d --name postsharp-headless postsharp-headless:ci
          ready=0
          for i in $(seq 1 90); do
            if docker exec postsharp-headless curl -fsS http://127.0.0.1:5199/api/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' postsharp-headless)" != "running" ]; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container headless MCP did not become ready"
            docker logs postsharp-headless
            exit 1
          fi

      - name: Check MCP tools
        run: |
          cat > initialize.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}
          JSON
          docker exec -i postsharp-headless curl -fsS \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @- http://127.0.0.1:5199/mcp < initialize.json > /dev/null
          cat > tools-request.json <<'JSON'
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          JSON
          docker exec -i postsharp-headless curl -fsS \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @- http://127.0.0.1:5199/mcp < tools-request.json > tools.json
          python3 - <<'PY'
          import json
          data = json.load(open("tools.json"))
          tools = [tool["name"] for tool in data["result"]["tools"]]
          assert "verify_endpoint" in tools
          assert "start_sequence_run" in tools
          assert "start_import" in tools
          assert len(tools) >= 84
          print(f"{len(tools)} tools")
          PY

      - name: Dump container log
        if: failure()
        run: |
          docker logs postsharp-headless || true
          docker exec postsharp-headless sh -c 'ls -la /data /data/logs 2>&1; for f in /data/logs/*.log; do echo "== $f"; tail -n 200 "$f"; done 2>&1' || true
          docker exec postsharp-headless sh -c 'for p in /proc/[0-9]*; do printf "%s " "$p"; tr "\0" " " < "$p/cmdline"; echo; done' || true
          docker exec postsharp-headless sh -c 'cat /proc/net/tcp' || true

      - name: Stop container
        if: always()
        run: docker rm -f postsharp-headless

  action-smoke:
    name: Composite action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start PostSharp MCP
        id: postsharp
        uses: ./.github/actions/postsharp-mcp
        with:
          version: 1.11.8

      - name: Check MCP tools
        run: |
          endpoint="${{ steps.postsharp.outputs.endpoint }}"
          cat > initialize.json <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"action-smoke","version":"1.0"}}}
          JSON
          curl -fsS -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @initialize.json "$endpoint/mcp" > /dev/null
          cat > tools-request.json <<'JSON'
          {"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}
          JSON
          curl -fsS -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data-binary @tools-request.json "$endpoint/mcp" > tools.json
          python3 - <<'PY'
          import json
          data = json.load(open("tools.json"))
          tools = [tool["name"] for tool in data["result"]["tools"]]
          assert "start_sequence_run" in tools
          assert "start_import" in tools
          assert len(tools) >= 84
          print(f"{len(tools)} tools")
          PY

      - name: Dump headless log
        if: failure()
        run: cat "${{ steps.postsharp.outputs.log }}" || true

      - name: Stop headless service
        if: always()
        run: pkill -f "$RUNNER_TEMP/postsharp-" 2>/dev/null || true
